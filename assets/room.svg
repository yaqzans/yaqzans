  .logo{color:#ff3b3b;animation:hue 20.64s step-end infinite}
  @keyframes hue{0%{color:#ff3b3b}12.5%{color:#3bff6f}25%{color:#3b8bff}37.5%{color:#ffe03b}50%{color:#ff3bd8}62.5%{color:#3bfff2}75%{color:#ff8a3b}87.5%{color:#fff}}
  .tri{animation:blink 1.4s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .blink,.vcr{animation:blink 1s step-end infinite}
  .osd{filter:drop-shadow(2px 0 0 rgba(255,40,40,.7)) drop-shadow(-2px 0 0 rgba(40,200,255,.7))}
</style><clipPath id="frame"><rect width="960" height="540" rx="22"/></clipPath><g clip-path="url(#frame)">
